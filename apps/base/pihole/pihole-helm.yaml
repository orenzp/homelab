apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: HelmRepository
metadata:
  name: mojo2600
  namespace: flux-system
spec:
  url: https://mojo2600.github.io/pihole-kubernetes/
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  releaseName: pihole
  targetNamespace: pihole
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      version: "2.12.x"
  interval: 1h
  install:
    createNamespace: true
  values:
    serviceWeb:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/allow-shared-ip: pihole
    serviceDns:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/allow-shared-ip: pihole
    persistentVolumeClaim:
      enabled: true
      storageClass: longhorn
      size: 1Gi
